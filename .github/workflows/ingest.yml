# 日次取り込み（毎日 02:00 JST = 17:00 UTC）
# - data/docs/ 配下の新規・変更ファイルを取り込む（既存は差分判定でスキップ）
# - DB に触るので Supabase Free の「1 週間非アクティブで一時停止」も防げる
# - --prune は付けない（意図しない削除を避ける。機密変更は人が手動で実行）
# - 注意: リポジトリに 60 日間コミットが無いと schedule は自動停止する
name: ingest

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "ハッシュが同じでも入れ直す"
        type: boolean
        default: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL_INGEST: ${{ secrets.DATABASE_URL_INGEST }}
      DATABASE_URL_BOT: ${{ secrets.DATABASE_URL_BOT }}
      RAG_BOT_PASSWORD: ${{ secrets.RAG_BOT_PASSWORD }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DOCS_DIR: ./data/docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: keep-alive & stats
        run: npm run db:stats
      - name: ingest
        run: npm run ingest -- ${{ inputs.force && '--force' || '' }}
